<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog CRUD App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Blog Manager</h1>
    </header>

    <div class="form-container">
      <h2 id="form-title">Create New Blog Post</h2>
      <form id="blog-form">
        <input type="hidden" id="blog-id">
        
        <div class="form-group">
          <label for="title">Title *</label>
          <input type="text" id="title" placeholder="Enter blog title" required>
        </div>

        <div class="form-group">
          <label for="author">Author</label>
          <input type="text" id="author" placeholder="Anonymous">
        </div>

        <div class="form-group">
          <label for="body">Content *</label>
          <textarea id="body" rows="5" placeholder="Write your blog content..." required></textarea>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submit-btn">Create Blog</button>
          <button type="button" class="btn btn-secondary" id="cancel-btn" style="display: none;">Cancel</button>
        </div>
      </form>
    </div>

    <div class="blogs-container">
      <h2>All Blog Posts</h2>
      <div id="blogs-list"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
